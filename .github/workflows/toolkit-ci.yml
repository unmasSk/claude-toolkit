name: Toolkit CI

on:
  push:
    branches: [main]
    paths:
      - "unmassk-toolkit/**"
      - "bin/**"
      - "pyproject.toml"
      - ".github/workflows/toolkit-ci.yml"
  pull_request:
    paths:
      - "unmassk-toolkit/**"
      - "bin/**"
      - "pyproject.toml"
      - ".github/workflows/toolkit-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: .github/workflows/toolkit-ci.yml

      - name: Install pytest
        run: pip install pytest==9.1.1 pyyaml==6.0.3

      - name: Run toolkit test suite
        run: python -m pytest unmassk-toolkit/tests -q

      - name: Run design-gate (skill frontmatter collision check)
        run: python unmassk-toolkit/bin/design_gate.py
